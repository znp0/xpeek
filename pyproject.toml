[project]
name = "xpeek"
version = "0.1.0"
description = "Copy and translate screen text on Wayland"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rapidocr-onnxruntime>=1.2.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "PySide6>=6.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
deepl = ["deep-translator>=1.11.0"]
all = ["openai>=1.0.0", "deep-translator>=1.11.0"]

[project.scripts]
xpeek = "xpeek.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["xpeek", "xpeek.providers"]

[project.urls]
Repository = "https://github.com/znp0/xpeek"
